apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ctpipeline
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - api.yaml
  - worker-cpu.yaml
  - worker-gpu.yaml
  - networkpolicy.yaml
images:
  - name: ctpipeline
    newName: ghcr.io/example/ctpipeline   # replace with your registry
    newTag: "0.1.0"                       # pin by digest in production
